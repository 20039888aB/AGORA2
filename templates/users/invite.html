{% extends "base.html" %}
{% block title %}Invite Users{% endblock %}

{% block content %}
<div class="container mx-auto px-6 pt-24 pb-8 max-w-3xl">
    <div class="glass p-6 mb-6">
        <h1 class="text-2xl font-bold text-white mb-2">Invite Users</h1>
        <p class="text-gray-300">Add team members to your organization.</p>
    </div>

    <form method="post" class="glass p-6 space-y-4">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-300 mb-2">First Name</label>
                <input type="text" name="first_name" class="form-input w-full" required>
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">Last Name</label>
                <input type="text" name="last_name" class="form-input w-full" required>
            </div>
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-2">Email</label>
            <input type="email" name="email" class="form-input w-full" required>
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-2">Role</label>
            <select name="role" class="form-select w-full" required>
                {% for role_code, role_label in role_choices %}
                <option value="{{ role_code }}">{{ role_label }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-2">Temporary Password</label>
            <input type="password" name="password" minlength="8" class="form-input w-full" required>
            <p class="text-xs text-gray-400 mt-1">Minimum 8 characters.</p>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary">Create User</button>
            <a href="/users/manage/" class="btn-secondary">Back to Users</a>
        </div>
    </form>
</div>
{% endblock %}
