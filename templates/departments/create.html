{% extends "base.html" %}
{% block title %}Create Department{% endblock %}

{% block content %}
<div class="container mx-auto px-6 pt-24 pb-8 max-w-3xl">
    <div class="glass p-6 mb-6">
        <h1 class="text-2xl font-bold text-white mb-2">Create Department</h1>
        <p class="text-gray-300">Add a department to your organizational structure.</p>
    </div>

    <form method="post" class="glass p-6 space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm text-gray-300 mb-2">Department Name</label>
            <input type="text" name="name" class="form-input w-full" required>
        </div>

        <div>
            <label class="block text-sm text-gray-300 mb-2">Description</label>
            <textarea name="description" rows="4" class="form-textarea w-full" placeholder="What this department is responsible for"></textarea>
        </div>

        <label class="flex items-center gap-2 text-gray-300">
            <input type="checkbox" name="is_active" checked>
            <span>Active department</span>
        </label>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="btn-primary">Create Department</button>
            <a href="/departments/manage/" class="btn-secondary">Back to Departments</a>
        </div>
    </form>
</div>
{% endblock %}
